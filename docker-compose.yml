version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mangovision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mangovision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mangovision"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mangovision_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mangovision
      - JWT_SECRET_KEY=mangovision-super-secret-jwt-key-change-in-production-2026
      - ML_MODE=mock
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mangovision_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
